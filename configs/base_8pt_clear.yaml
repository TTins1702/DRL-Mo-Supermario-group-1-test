exp_name: "base_8pt_clear"
seed: 42
torch_deterministic: true
cuda: true

# Environment configuration (Phân hệ 1)
env:
  world: 1
  stage: 1
  num_envs: 8
  action_type: "speedrun"      # Discrete(7) Speedrun actions
  skip_frames: 4
  stack_frames: 4
  frame_size: [84, 84]
  scale_components: [0.05, 0.05, 0.08, 0.01, 0.02]
  use_milestone: true
  beta_milestone: 0.1
  use_anti_stuck: true
  beta_stuck: 0.1
  stuck_steps: 60

# Model architecture (Phân hệ 2)
model:
  in_channels: 4
  action_dim: 7
  feature_dim: 512
  critic_dim: 5

# MO-PPO Agent & Hyperparameters (Phân hệ 3)
agent:
  total_timesteps: 2000000
  num_steps: 512               # T: Rollout steps per env (batch_size = 512 * 8 = 4096)
  update_epochs: 4             # PPO epochs per update
  mini_batch_size: 256         # Mini-batch size
  learning_rate: 0.00025       # Initial learning rate
  lr_end: 0.00001              # Final learning rate
  anneal_lr: true              # Linear learning rate decay
  gamma: 0.99                  # Discount factor
  gae_lambda: 0.95             # GAE lambda
  clip_coef: 0.2               # PPO clip threshold epsilon
  clip_vloss: false
  ent_coef: 0.01               # Entropy bonus coefficient
  vf_coef: 0.5                 # Value function coefficient
  max_grad_norm: 0.5           # Gradient clipping norm
  norm_adv_per_obj: true       # Independent normalization for each 5D objective advantage
  # 5D objective weights: [x_pos, time, death, coin, enemy]
  # Standard 8-point baseline prioritizes forward progress and survival
  weights: [0.65, 0.10, 0.20, 0.02, 0.03]

# Checkpointing & Evaluation (Phân hệ 4)
logging:
  save_freq_updates: 25        # Save latest.pt every 25 updates (~100k frames)
  eval_freq_updates: 25        # Evaluate agent every 25 updates
  eval_episodes: 10            # Number of evaluation episodes
  log_freq_updates: 1          # Log training stats every update
  use_tensorboard: true
  use_wandb: false
  wandb_project: "mo-supermario-group-1"
  wandb_entity: null
